name: finance_tracker
description: Personal expense and income tracker for Android, in rupees, stored on the phone.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  csv: ^8.0.0
  excel: ^4.0.6
  file_picker: ^13.4.1
  flutter_local_notifications: ^23.0.4
  flutter_riverpod: ^3.5.0
  google_mlkit_text_recognition: ^1.0.3
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  sqflite: ^2.4.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.7

flutter:
  default-flavor: full
  uses-material-design: true
